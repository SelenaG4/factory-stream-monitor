# Production wiring: Kafka (KRaft, no ZooKeeper) + producer + Spark streaming job +
# dashboard. This is the "real" streaming architecture; the in-repo demo validates the
# same Spark job against a file source (no broker needed) so everything is testable
# without standing this up. Bring it up with:  docker compose -f docker/docker-compose.yml up
services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build: { context: .., dockerfile: docker/Dockerfile.pipeline }
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      STREAM_SOURCE: kafka
      KAFKA_BOOTSTRAP: kafka:9092
    command: python -m stream.producer 20000

  streaming:
    build: { context: .., dockerfile: docker/Dockerfile.pipeline }
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      STREAM_SOURCE: kafka
      KAFKA_BOOTSTRAP: kafka:9092
    command: python -m stream.streaming_job kafka

  dashboard:
    build: { context: .., dockerfile: docker/Dockerfile.dashboard }
    ports: ["8501:8501"]
    depends_on: [streaming]
